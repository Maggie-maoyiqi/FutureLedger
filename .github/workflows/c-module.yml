name: C module offline quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FUTURELEDGER_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-c4.txt
      - run: python scripts/run_c4_quality.py --output /tmp/futureledger-c4-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c4-offline-evidence
          path: /tmp/futureledger-c4-evidence
          include-hidden-files: false
