<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutureLedger · 账单问答</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#1e3137;background:#f7f8f7;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;height:100vh}button,input,select{font:inherit}button{cursor:pointer}
    .layout{height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr)}
    .sidebar{background:#edf2f0;border-right:1px solid #dce5e1;padding:18px 14px;display:flex;flex-direction:column;min-height:0}
    .brand{font-weight:750;font-size:18px;letter-spacing:-.3px;padding:5px 9px 18px;color:#145d55}.brand span{display:block;color:#71817e;font-size:11px;font-weight:500;margin-top:4px;letter-spacing:0}
    .new-chat{background:#fff;border:1px solid #cfdbd6;border-radius:10px;padding:11px 12px;text-align:left;color:#2b4b47;font-weight:650;box-shadow:0 1px 2px #16352c0a}.new-chat:hover,.session:hover{background:#f9fcfa}
    .section-label{font-size:11px;color:#74817f;text-transform:uppercase;letter-spacing:.07em;margin:22px 9px 8px}
    .sessions{overflow:auto;display:flex;flex-direction:column;gap:4px;min-height:50px}.session{border:0;background:transparent;text-align:left;padding:10px;border-radius:8px;color:#435653;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session.active{background:#dfeae6;color:#174f48;font-weight:650}
    .side-footer{margin-top:auto;border-top:1px solid #d8e1dd;padding:14px 5px 2px}.side-footer label{display:block;font-size:11px;color:#74817f;margin-bottom:7px}.side-footer select{width:100%;border:1px solid #cfdbd6;border-radius:8px;background:white;padding:9px;color:#344a46}.local-note{font-size:10px;line-height:1.5;color:#788783;margin:9px 2px 0}
    .main{min-width:0;display:flex;flex-direction:column;height:100vh}.topbar{height:58px;flex:none;border-bottom:1px solid #e7eae8;display:flex;align-items:center;padding:0 30px;background:#fbfcfb;font-weight:650;color:#35544e}.scope{margin-left:auto;font-size:11px;font-weight:500;color:#62736f;background:#edf3f0;border-radius:100px;padding:6px 10px}
    .messages{flex:1;overflow:auto;padding:24px max(24px,calc((100% - 850px)/2));scroll-behavior:smooth}.welcome{max-width:720px;margin:12vh auto 0;text-align:center}.welcome h1{font-size:28px;color:#25443e;letter-spacing:-.6px;margin-bottom:9px}.welcome p{color:#6c7c78;font-size:14px;line-height:1.7}.examples{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:22px}.examples button{border:1px solid #dce5e1;background:#fff;color:#405c56;border-radius:18px;padding:9px 13px;font-size:12px}.examples button:hover{border-color:#8bb9a9;background:#f3faf6}
    .turn{display:flex;margin:17px 0;gap:10px;align-items:flex-start}.turn.user{justify-content:flex-end}.avatar{width:27px;height:27px;border-radius:50%;background:#dcebe5;color:#286456;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}.turn.user .avatar{order:2;background:#dbe5f3;color:#496186}.bubble{max-width:min(760px,88%);min-width:80px}.user-text{background:#e8f0ec;border-radius:15px 4px 15px 15px;padding:11px 15px;line-height:1.6;color:#263e38;white-space:pre-wrap}.assistant-text{line-height:1.65;padding:3px 2px;color:#334743}.result-card{background:white;border:1px solid #e0e7e3;border-radius:13px;padding:16px;margin-top:9px;box-shadow:0 2px 8px #203d3007}.answer{font-size:19px;font-weight:700;color:#225b50;margin-bottom:12px}.answer.metric{font-size:29px;letter-spacing:-.4px}.empty{color:#74817e;font-size:13px;padding:12px 0}
    .table-wrap{overflow:auto;border:1px solid #e7ece9;border-radius:9px}table{border-collapse:collapse;width:100%;font-size:12px;min-width:360px}th,td{text-align:left;border-bottom:1px solid #edf0ee;padding:9px 11px;white-space:nowrap}th{font-weight:650;background:#f6f8f7;color:#5d6e69}tr:last-child td{border-bottom:0}td.amount{text-align:right;font-variant-numeric:tabular-nums}
    .chart{width:100%;height:auto;min-height:220px}.legend{display:flex;gap:14px;flex-wrap:wrap;margin:9px 0;color:#566762;font-size:11px}.legend-item{display:flex;gap:6px;align-items:center}.swatch{width:9px;height:9px;border-radius:50%}.export{display:inline-flex;margin-top:12px;text-decoration:none;color:#22675a;font-size:11px;border:1px solid #d9e5df;border-radius:7px;padding:6px 9px}.export:hover{background:#f2f8f4}
    .composer-wrap{border-top:1px solid #e7eae8;background:#fbfcfb;padding:14px 24px 17px}.composer{max-width:850px;margin:auto;background:white;border:1px solid #ccd9d3;border-radius:14px;box-shadow:0 3px 12px #1e3d300a;padding:8px;display:flex;align-items:flex-end;gap:8px}.composer:focus-within{border-color:#82b5a3;box-shadow:0 0 0 3px #71ad981b}.composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:10px 11px;color:#223b35}.composer button{border:0;border-radius:9px;background:#276d60;color:white;padding:10px 16px;font-weight:650}.composer button:disabled{opacity:.5}.composer-help{max-width:850px;margin:7px auto 0;font-size:10px;color:#85918e;padding:0 3px}.health-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#59a37c;margin-right:6px}
    .user-row{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#344a46;font-size:13px}.logout{border:1px solid #cfdbd6;border-radius:7px;background:#fff;padding:6px 9px;color:#526862;font-size:11px}
    .auth-gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:#152923a8;backdrop-filter:blur(4px)}.auth-gate[hidden]{display:none}.auth-card{width:min(420px,100%);padding:28px;background:#fff;border-radius:16px;box-shadow:0 18px 70px #071b1650}.auth-card h1{margin:0 0 8px;font-size:23px;color:#22564c}.auth-card p{margin:0 0 20px;color:#71817d;font-size:13px;line-height:1.6}.auth-card label{display:block;margin:13px 0 6px;color:#435953;font-size:12px;font-weight:650}.auth-card select,.auth-card input{width:100%;border:1px solid #cfdbd6;border-radius:9px;padding:11px 12px;background:#fff;color:#243c36}.auth-card input:focus,.auth-card select:focus{outline:2px solid #83b9a7;border-color:transparent}.auth-actions{display:flex;gap:9px;margin-top:18px}.auth-actions button{flex:1;border:0;border-radius:9px;padding:11px;font-weight:650}.auth-primary{background:#276d60;color:white}.auth-secondary{background:#edf3f0;color:#35584f}.auth-message{min-height:20px;margin-top:12px!important;color:#9b473e!important;font-size:12px!important}
    @media(max-width:760px){body{height:auto;min-height:100vh}.layout{height:100vh;min-height:600px;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.sidebar{padding:8px 10px 7px;border-right:0;border-bottom:1px solid #dce5e1;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}.brand{padding:3px 6px;font-size:15px}.brand span,.section-label,.side-footer label,.local-note{display:none}.new-chat{padding:8px 10px;justify-self:end}.sessions{grid-column:1/-1;flex-direction:row;min-height:0}.session{max-width:190px;padding:7px 10px;font-size:12px}.side-footer{display:none}.main{height:auto;min-height:0}.topbar{height:48px;padding:0 14px;font-size:13px}.scope{font-size:9px}.messages{padding:18px 13px}.welcome{margin:7vh auto 0}.welcome h1{font-size:23px}.bubble{max-width:91%}.composer-wrap{padding:10px 11px 12px}.composer input{padding:8px}.composer button{padding:9px 13px}}
    @media(prefers-reduced-motion:reduce){.messages{scroll-behavior:auto}}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">FutureLedger<span><span class="health-dot"></span>账单问答</span></div>
    <button class="new-chat" id="newChat">＋ 新建对话</button>
    <div class="section-label">最近对话</div>
    <nav class="sessions" id="sessions" aria-label="历史对话"></nav>
    <div class="side-footer">
      <label>当前登录</label>
      <div class="user-row"><span id="activeUser">未登录</span><button id="logout" class="logout" type="button">退出登录</button></div>
      <div class="local-note">查询路由只提供当前用户的有限账单上下文；转账需确认并再次输入 FutureLedger 密码。规划请求有独立路由，现金流由后端模拟接口计算。</div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">账单问答 <span class="scope" id="scope" title="连接模型后发送当前用户的账户 ID、商户名单和最多 30 条流水样例；不含其他用户数据。查询由数据库执行。">本用户数据 · 最多 30 条样例</span></header>
    <section class="messages" id="messages" aria-live="polite"></section>
    <div class="composer-wrap">
      <form id="form" class="composer"><input id="question" autocomplete="off" maxlength="500" aria-label="输入账单问题" placeholder="问问你的支出、收入或交易记录…"><button id="send" type="submit">发送</button></form>
      <div class="composer-help" id="help">回车发送 · 查询只读；转账需确认和密码复核；现金流规划使用独立模拟接口</div>
    </div>
  </main>
</div>
<section id="authGate" class="auth-gate" aria-label="FutureLedger 登录">
  <div class="auth-card">
    <h1>登录 FutureLedger</h1>
    <p>这是本地合成数据演示。首次使用请为演示账号设置个人登录密码；密码只用于认证，不会进入聊天或发送给模型。</p>
    <form id="authForm">
      <label for="authUser">演示账号</label>
      <select id="authUser" required><option value="test_user">test_user</option><option value="isolation_user">isolation_user</option></select>
      <label for="authPassword">个人登录密码</label>
      <input id="authPassword" type="password" autocomplete="current-password" required minlength="12" maxlength="128" placeholder="至少 12 个字符">
      <div class="auth-actions"><button id="authSubmit" class="auth-primary" type="submit">登录</button><button id="authMode" class="auth-secondary" type="button">首次设置密码</button></div>
      <p id="authMessage" class="auth-message" aria-live="polite"></p>
    </form>
  </div>
</section>
<section id="reauthGate" class="auth-gate" aria-label="确认转账身份" hidden>
  <div class="auth-card">
    <h1>确认这笔转账</h1>
    <p id="reauthDescription">请输入 FutureLedger 登录密码以授权这次演示操作。密码不会进入聊天记录或发送给模型。</p>
    <form id="reauthForm">
      <label for="reauthPassword">FutureLedger 登录密码</label>
      <input id="reauthPassword" type="password" autocomplete="current-password" required minlength="12" maxlength="128">
      <label id="transferCategoryLabel" for="transferCategory" hidden>这笔转出的用途（计入该支出类别）</label>
      <select id="transferCategory" hidden><option>餐饮</option><option>交通</option><option>购物</option><option>娱乐</option><option>订阅</option><option>房租</option><option>医疗</option><option>其他</option></select>
      <div class="auth-actions"><button class="auth-primary" type="submit">验证密码</button><button id="reauthCancel" class="auth-secondary" type="button">取消</button></div>
      <p id="reauthMessage" class="auth-message" aria-live="polite"></p>
    </form>
  </div>
</section>
<script>
"use strict";
const $=id=>document.getElementById(id), STORAGE='futureledger-chat-sessions-v2';
const colors=['#267b68','#d57c4b','#5877ba','#a15d9a','#c3a12d','#4196a0','#da6574','#7d8d43'];
const examples=['上个月各项支出','过去 3 个月各项支出趋势','上个月的支出是多少？','上个月转账记录','给测试用户B转 25 元（演示）'];
let allChats=loadChats(),activeChat=null,busy=false,authToken=null,loggedInUser=null,registerMode=false,reauthMessage=null;
function loadChats(){try{return JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch{return {}}}
function saveChats(){localStorage.setItem(STORAGE,JSON.stringify(allChats))}
function userId(){return loggedInUser}
function chats(){const id=userId();return id?(allChats[id]||(allChats[id]=[])):[]}
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=String(text);return x}
function money(cents){return cents===null||cents===undefined?'—':'¥'+(Number(cents)/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function titleFor(q){return q.length>22?q.slice(0,22)+'…':q}
async function api(path,options){let r;try{r=await fetch(path,options)}catch{throw Error('无法连接到 FutureLedger 本地服务。请确认后端仍在运行，并刷新页面后重试。')}let body;try{body=await r.json()}catch{throw Error('服务未返回有效结果')}if(!r.ok){const d=body.detail;const error=Error(d?.message||d||'请求失败');error.status=r.status;throw error}return body}
async function createServerSession(){if(!authToken)throw Error('请先登录');const r=await api('/api/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({auth_token:authToken,dataset_id:'personal_ledger'})});return r.session_id}
function newLocalChat(sessionId){const chat={id:crypto.randomUUID(),sessionId,user:userId(),title:'新对话',messages:[]};chats().unshift(chat);activeChat=chat;saveChats();renderAll();$('question').focus();return chat}
async function newChat(){if(!authToken){$('authGate').hidden=false;return}try{busy=true;$('send').disabled=true;const token=await createServerSession();newLocalChat(token)}catch(e){showError(e.message)}finally{busy=false;$('send').disabled=false}}
function renderSessions(){const nav=$('sessions');nav.replaceChildren();for(const chat of chats()){const b=el('button','session'+(activeChat?.id===chat.id?' active':''),chat.title);b.title=chat.title;b.onclick=()=>{activeChat=chat;renderAll()};nav.append(b)}}
function renderAll(){renderSessions();const box=$('messages');box.replaceChildren();if(!activeChat||!activeChat.messages.length){renderWelcome(box);return}for(const message of activeChat.messages)renderMessage(box,message);box.scrollTop=box.scrollHeight}
function renderWelcome(box){const welcome=el('div','welcome');welcome.append(el('h1','','你的账单，直接问就好。'));welcome.append(el('p','','可以查某段时间的支出、收入、退款和转账，也可以按类别整理或看月度趋势。'));const chips=el('div','examples');for(const q of examples){const b=el('button','',q);b.onclick=()=>sendQuestion(q);chips.append(b)}welcome.append(chips);box.append(welcome)}
function renderMessage(box,message){const row=el('article','turn '+(message.role==='user'?'user':'assistant'));row.append(el('div','avatar',message.role==='user'?'你':'F'));const bubble=el('div','bubble');if(message.role==='user'){bubble.append(el('div','user-text',message.text))}else{bubble.append(el('div','assistant-text',message.text));if(message.actionId&&message.actionStatus==='pending'){const confirm=el('button','confirm-action','确认演示转账');confirm.type='button';confirm.style.cssText='margin:10px 0 0 2px;border:0;border-radius:8px;background:#276d60;color:#fff;padding:9px 13px;font-weight:650';confirm.onclick=()=>confirmAction(message);bubble.append(confirm)}if(message.result){const card=el('div','result-card');renderResult(card,message.result);bubble.append(card)}}row.append(bubble);box.append(row)}
function renderResult(card,result){const answer=el('div','answer'+(result.chart==='metric_card'?' metric':''),result.answer);card.append(answer);const rows=result.rows||[];if(!rows.length){card.append(el('div','empty','这段时间没有符合条件的记录。'))}else if(result.chart==='table'){renderTable(card,rows,result.valueFormat)}else if(result.chart==='bar'){renderBars(card,rows,result.valueFormat)}else if(result.chart==='line'){renderLines(card,rows,result.valueFormat)}if(result.queryId){const a=el('a','export','下载结果 CSV');a.href=`/api/queries/${encodeURIComponent(result.queryId)}/export.csv?session_id=${encodeURIComponent(activeChat.sessionId)}`;card.append(a)}}
function labelFor(key,valueFormat='money'){if(key==='value_cents'&&valueFormat==='count')return '笔数';return ({group_key:'项目',series_key:'类别',value_cents:'金额',posted_at:'入账时间',account_id:'账户',category:'类别',merchant:'商户',kind:'类型',direction:'方向',amount_cents:'金额'})[key]||key}
function cellValue(key,value,valueFormat='money'){if(key==='amount_cents'||key==='value_cents')return key==='value_cents'&&valueFormat==='count'?`${Number(value).toLocaleString('zh-CN')} 笔`:money(value);if(key==='kind')return ({expense:'支出',refund:'退款',income:'收入',transfer:'转账'})[value]||value;if(key==='direction')return value==='OUT'?'转出':'转入';return value??'—'}
function renderTable(target,rows,valueFormat='money'){const wrap=el('div','table-wrap'),table=el('table'),headers=Object.keys(rows[0]).filter(key=>!['id','account_id','user_id','query_id'].includes(key));const thead=el('thead'),head=el('tr');for(const key of headers)head.append(el('th','',labelFor(key,valueFormat)));thead.append(head);table.append(thead);const tbody=el('tbody');for(const row of rows){const tr=el('tr');for(const key of headers){const td=el('td',key.includes('cents')?'amount':'',cellValue(key,row[key],valueFormat));tr.append(td)}tbody.append(tr)}table.append(tbody);wrap.append(table);target.append(wrap)}
function renderBars(target,rows,valueFormat='money'){const max=Math.max(1,...rows.map(r=>Math.abs(Number(r.value_cents)||0)));const wrap=el('div','table-wrap'),table=el('table'),body=el('tbody');for(const r of rows){const tr=el('tr'),name=el('td','',r.group_key),cell=el('td');const track=el('div');track.style.cssText='height:9px;background:#eaf0ed;border-radius:8px;overflow:hidden;min-width:90px';const fill=el('span');fill.style.cssText=`display:block;height:100%;width:${Math.max(1,100*Math.abs(Number(r.value_cents)||0)/max)}%;background:#398a73;border-radius:8px`;track.append(fill);cell.append(track);tr.append(name,cell,el('td','amount',cellValue('value_cents',r.value_cents,valueFormat)));body.append(tr)}table.append(body);wrap.append(table);target.append(wrap)}
function renderLines(target,rows,valueFormat='money'){const months=[...new Set(rows.map(x=>x.group_key))].sort();const seriesKeys=[...new Set(rows.map(x=>x.series_key??'总额'))];const vals=rows.map(x=>Number(x.value_cents)||0),lo=Math.min(0,...vals),hi=Math.max(1,...vals);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 820 300');svg.setAttribute('class','chart');svg.setAttribute('role','img');svg.setAttribute('aria-label','支出月度折线趋势');const plot={l:82,r:800,t:20,b:246},x=i=>plot.l+(plot.r-plot.l)*i/Math.max(1,months.length-1),y=v=>plot.b-(v-lo)*(plot.b-plot.t)/Math.max(1,hi-lo);for(let i=0;i<5;i++){const ratio=i/4,yy=plot.t+(plot.b-plot.t)*ratio,value=hi-(hi-lo)*ratio,line=document.createElementNS(svg.namespaceURI,'line');line.setAttribute('x1',plot.l);line.setAttribute('x2',plot.r);line.setAttribute('y1',yy);line.setAttribute('y2',yy);line.setAttribute('stroke','#e8eeeb');svg.append(line);const label=document.createElementNS(svg.namespaceURI,'text');label.setAttribute('x',plot.l-9);label.setAttribute('y',yy+4);label.setAttribute('text-anchor','end');label.setAttribute('fill','#71817d');label.setAttribute('font-size','11');label.textContent=valueFormat==='count'?Math.round(value).toLocaleString('zh-CN'):(value/100>=10000?'¥'+(value/10000).toFixed(1)+'万':'¥'+Math.round(value/100).toLocaleString('zh-CN'));svg.append(label)}for(let i=0;i<months.length;i++){const txt=document.createElementNS(svg.namespaceURI,'text');txt.setAttribute('x',x(i));txt.setAttribute('y',plot.b+23);txt.setAttribute('text-anchor','middle');txt.setAttribute('fill','#71817d');txt.setAttribute('font-size','11');txt.textContent=months[i];svg.append(txt)}seriesKeys.forEach((key,si)=>{const points=months.map((m,mi)=>{const row=rows.find(r=>r.group_key===m&&(r.series_key??'总额')===key);return [x(mi),y(row?(Number(row.value_cents)||0):0)]});const p=document.createElementNS(svg.namespaceURI,'polyline');p.setAttribute('points',points.map(a=>a.join(',')).join(' '));p.setAttribute('fill','none');p.setAttribute('stroke',colors[si%colors.length]);p.setAttribute('stroke-width','3');p.setAttribute('stroke-linejoin','round');p.setAttribute('stroke-linecap','round');svg.append(p);for(const [cx,cy] of points){const dot=document.createElementNS(svg.namespaceURI,'circle');dot.setAttribute('cx',cx);dot.setAttribute('cy',cy);dot.setAttribute('r','3.5');dot.setAttribute('fill',colors[si%colors.length]);svg.append(dot)}});target.append(svg);const legend=el('div','legend');seriesKeys.forEach((key,i)=>{const item=el('span','legend-item'),swatch=el('i','swatch');swatch.style.background=colors[i%colors.length];item.append(swatch,document.createTextNode(key));legend.append(item)});target.append(legend);renderTable(target,rows,valueFormat)}
function addMessage(message){activeChat.messages.push(message);saveChats();renderAll()}
function showError(text){if(!activeChat){const box=$('messages');box.replaceChildren(el('div','empty',text));return}addMessage({role:'assistant',text})}
async function sendQuestion(raw){const question=raw.trim();if(!authToken){$('authGate').hidden=false;return}if(!question||busy)return;if(!activeChat||activeChat.user!==userId())await newChat();if(!activeChat)return;busy=true;$('send').disabled=true;$('help').textContent='正在判断请求类型…';if(activeChat.title==='新对话')activeChat.title=titleFor(question);addMessage({role:'user',text:question});$('question').value='';
  try{let response;try{response=await api('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:activeChat.sessionId,question})})}catch(error){if(error.status!==403)throw error;activeChat.sessionId=await createServerSession();saveChats();response=await api('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:activeChat.sessionId,question})})}
    const text=response.status==='answer'?response.answer:(response.message||'请换一种方式描述问题。');const result=response.status==='answer'?{answer:text,chart:response.chart,rows:response.rows,valueFormat:response.value_format,queryId:response.query_id}:null;const assistantMessage={role:'assistant',text,result,actionId:response.action_id,actionStatus:response.status==='confirmation_required'?'pending':undefined};addMessage(assistantMessage);if(assistantMessage.actionStatus==='pending')confirmAction(assistantMessage)
  }catch(error){addMessage({role:'assistant',text:error.message||'请求失败，请稍后重试。'})}finally{busy=false;$('send').disabled=false;$('help').textContent='回车发送 · 查询只读；转账需确认和密码复核；现金流规划使用独立模拟接口';$('question').focus()}}
function confirmAction(message){if(!authToken||busy||!activeChat)return;reauthMessage=message;$('reauthPassword').value='';$('transferCategory').hidden=true;$('transferCategoryLabel').hidden=true;$('reauthForm').querySelector('button[type="submit"]').textContent='验证密码';$('reauthMessage').textContent='';$('reauthGate').hidden=false;$('reauthPassword').focus()}
$('form').addEventListener('submit',event=>{event.preventDefault();sendQuestion($('question').value)});
$('newChat').addEventListener('click',newChat);
$('authMode').addEventListener('click',()=>{registerMode=!registerMode;$('authSubmit').textContent=registerMode?'设置密码':'登录';$('authMode').textContent=registerMode?'返回登录':'首次设置密码';$('authMessage').textContent='';$('authPassword').value='';$('authPassword').autocomplete=registerMode?'new-password':'current-password'});
$('authForm').addEventListener('submit',async event=>{event.preventDefault();const username=$('authUser').value,password=$('authPassword').value;$('authMessage').textContent='';$('authSubmit').disabled=true;try{if(registerMode){await api('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});registerMode=false;$('authSubmit').textContent='登录';$('authMode').textContent='首次设置密码';$('authMessage').textContent='密码已设置，请登录。'}else{const response=await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});authToken=response.auth_token;loggedInUser=response.username;$('activeUser').textContent=loggedInUser;$('authPassword').value='';$('authGate').hidden=true;activeChat=chats()[0]||null;if(activeChat){activeChat.sessionId=await createServerSession();saveChats();renderAll()}else await newChat()}}catch(error){$('authMessage').textContent=error.message||'认证失败'}finally{$('authPassword').value='';$('authSubmit').disabled=false}});
$('logout').addEventListener('click',async()=>{if(authToken){try{await api('/api/auth/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({auth_token:authToken})})}catch{}}authToken=null;loggedInUser=null;activeChat=null;$('activeUser').textContent='未登录';$('authGate').hidden=false;$('reauthGate').hidden=true;renderAll()});
$('reauthCancel').addEventListener('click',()=>{$('reauthGate').hidden=true;$('reauthPassword').value='';$('reauthMessage').textContent='';reauthMessage=null});
$('reauthForm').addEventListener('submit',async event=>{event.preventDefault();if(!reauthMessage||!activeChat||busy)return;$('reauthMessage').textContent='';busy=true;const submit=$('reauthForm').querySelector('button[type="submit"]');submit.disabled=true;try{if(!reauthMessage.authorizationId){const password=$('reauthPassword').value;const response=await api(`/api/actions/${encodeURIComponent(reauthMessage.actionId)}/authorize`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:activeChat.sessionId,password})});reauthMessage.authorizationId=response.authorization_id;$('reauthPassword').value='';$('reauthPassword').required=false;$('reauthPassword').disabled=true;$('transferCategory').hidden=false;$('transferCategoryLabel').hidden=false;submit.textContent='确认转账并记入支出';$('reauthMessage').textContent='密码已验证。选择用途类别后，再确认执行。'}else{const response=await api(`/api/actions/${encodeURIComponent(reauthMessage.actionId)}/confirm`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:activeChat.sessionId,authorization_id:reauthMessage.authorizationId,category:$('transferCategory').value})});reauthMessage.actionStatus='done';reauthMessage.text+='\n'+response.message;delete reauthMessage.authorizationId;saveChats();$('reauthGate').hidden=true;reauthMessage=null;renderAll()}}catch(error){$('reauthMessage').textContent=error.message||'操作未执行，请重试。'}finally{$('reauthPassword').value='';$('reauthPassword').disabled=false;$('reauthPassword').required=true;submit.disabled=false;busy=false}});
api('/api/health').then(s=>{$('scope').textContent=s.status==='ready'?'本用户数据 · 最多 30 条样例':'等待账单数据就绪'}).catch(()=>{$('scope').textContent='连接本地问数服务失败'});
activeChat=null;renderAll();$('authGate').hidden=false;
</script>
</body>
</html>
